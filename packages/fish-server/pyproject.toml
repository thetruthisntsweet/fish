[project]
name = "fish-server"
version = "0.0.0"
requires-python = ">=3.14"
# Not published: PyPI refuses any upload carrying this classifier.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fish-rules",
    "fish-agents",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
fish-rules = { workspace = true }
fish-env = { workspace = true }
fish-agents = { workspace = true }
