[project]
name = "fish-rules"
version = "0.2.0"
description = "The rules engine for the card game Fish: deterministic, standard library only."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["fish", "card game", "hidden information", "multi-agent", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thetruthisntsweet/fish"
Documentation = "https://github.com/thetruthisntsweet/fish/tree/main/docs"
Changelog = "https://github.com/thetruthisntsweet/fish/blob/main/CHANGELOG.md"
Issues = "https://github.com/thetruthisntsweet/fish/issues"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
fish-rules = { workspace = true }
fish-env = { workspace = true }
fish-agents = { workspace = true }

# Stricter lint for the rules package (Implementation Environment §6).
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Use fish_rules.rng: replay must not depend on Python's random module."
"secrets".msg = "fish-rules takes seeds as input; the server chooses them."
"time".msg = "No clock in fish-rules; time enters only through the server."
"datetime".msg = "No clock in fish-rules; time enters only through the server."
"numpy".msg = "fish-rules is standard-library only."
