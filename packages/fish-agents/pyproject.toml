[project]
name = "fish-agents"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["fish-rules"]

[project.optional-dependencies]
env = ["fish-env"]  # fish_agents.play runs agents in the environment; the server never needs it
torch = ["torch"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
fish-rules = { workspace = true }
fish-env = { workspace = true }
fish-agents = { workspace = true }
