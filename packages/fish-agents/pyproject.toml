[project]
name = "fish-agents"
version = "0.1.0"
description = "Baseline agents for the card game Fish, and the interface they share."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["fish", "card game", "agents", "multi-agent", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["fish-rules>=0.1,<0.2"]

[project.optional-dependencies]
# fish_agents.play runs agents in the environment; the server never needs it.
env = ["fish-env>=0.1,<0.2"]
torch = ["torch"]

[project.urls]
Homepage = "https://github.com/thetruthisntsweet/fish"
Documentation = "https://github.com/thetruthisntsweet/fish/tree/main/docs"
Changelog = "https://github.com/thetruthisntsweet/fish/blob/main/CHANGELOG.md"
Issues = "https://github.com/thetruthisntsweet/fish/issues"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
fish-rules = { workspace = true }
fish-env = { workspace = true }
fish-agents = { workspace = true }
