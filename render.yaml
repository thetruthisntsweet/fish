# Render Blueprint (T2.1 subtasks 12-14). Render reads this file from the repository root.
# Reference: https://render.com/docs/blueprint-spec
#
# Two sites (T4.3): staging, the pilot site, deploys every commit on main once CI passes;
# production, the study's site, deploys the `production` branch, which only the Deploy workflow
# moves, to a `site-*` tag on main that passed CI (.github/workflows/deploy.yml). Each site has its own database, address, cohort seed and email key.
services:
  - type: web
    name: fish-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb # the $7/month instance; the free plan sleeps and drops WebSockets
    region: virginia # cannot be changed later; closest region to most participants
    branch: main
    autoDeployTrigger: checksPass # deploy a new commit on main only once CI has passed
    healthCheckPath: /health
    # The pilot's address (T4.1; docs/runbooks/domains.md). Its DNS record is a CNAME from
    # fish-pilot to this service's onrender.com host. The onrender.com address is switched off,
    # so every page, sign-in link and session cookie uses this one address.
    domains:
      - fish-pilot.thedefinitivesanjeevexperience.com
    renderSubdomainPolicy: disabled
    # Runs after each build, before the new version starts: migrations, then the server's
    # own database login, then a check that the login can read but not alter (T2.1 §11).
    # If any step fails, the deploy is cancelled and the running version is left alone.
    preDeployCommand: python -m fish_server.deploy
    envVars:
      - key: FISH_ADMIN_DATABASE_URL # the owner's private URL: migrations and admin tools only
        fromDatabase:
          name: fish-staging-db
          property: connectionString
      - key: FISH_APP_DB_PASSWORD # the fish_server login's password; Render generates it
        generateValue: true
      # Sign-in by emailed link (T3.1). Links point at the pilot's address (T4.1).
      - key: FISH_PUBLIC_URL
        value: https://fish-pilot.thedefinitivesanjeevexperience.com
      - key: FISH_EMAIL
        value: resend
      - key: FISH_EMAIL_FROM
        value: Fish <signin@mail.thedefinitivesanjeevexperience.com>
      - key: FISH_RESEND_API_KEY # Resend key with sending access to that domain only
        sync: false
      - key: FISH_CONSENT_VERSION # the staging site shows the pilot text (Consent Screen §4)
        value: v1.0-pilot
      - key: FISH_COHORT_SEED # 64-bit; never changed once anyone has signed up (corpus.md §2.1)
        sync: false
      - key: FISH_PILOT_ENDED # no new tables from this Eastern day; FISH_TABLES_OPEN=yes reopens
        value: "2026-12-06" # them for a test (fish_server.opening; pilot.md §4)

  - type: web
    name: fish-production
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb # as staging; the plan can be raised in the dashboard at any time
    region: virginia
    branch: production # moved only by the Deploy workflow, to a tagged commit on main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    # The study's address (docs/runbooks/domains.md): a CNAME from fish to this service. Render
    # switches the onrender.com address off only once this one is verified, so
    # `renderSubdomainPolicy: disabled` is added after that (docs/runbooks/launch.md §1 step 7).
    domains:
      - fish.thedefinitivesanjeevexperience.com
    preDeployCommand: python -m fish_server.deploy
    envVars:
      - key: FISH_ADMIN_DATABASE_URL # the owner's private URL: migrations and admin tools only
        fromDatabase:
          name: fish-production-db
          property: connectionString
      - key: FISH_APP_DB_PASSWORD
        generateValue: true
      - key: FISH_PUBLIC_URL
        value: https://fish.thedefinitivesanjeevexperience.com
      - key: FISH_EMAIL
        value: resend
      - key: FISH_EMAIL_FROM
        value: Fish <signin@mail.thedefinitivesanjeevexperience.com>
      - key: FISH_RESEND_API_KEY # its own Resend key, sending from that domain only
        sync: false
      - key: FISH_CONSENT_VERSION # the study's text (Consent Screen §1), with terms v1.0
        value: v1.0
      - key: FISH_SIGNIN_DAILY_LIMIT # Resend Pro has no daily limit (email.md §2)
        value: "1500"
      - key: FISH_COHORT_SEED # its own; never changed once anyone has signed up (corpus.md §2.1)
        sync: false
      - key: FISH_OPENS # no new tables before this Eastern day (fish_server.opening; study.LAUNCH)
        value: "2026-12-08"

databases:
  - name: fish-staging-db # cannot be renamed later
    plan: 0.1c-256mb # $6/month; paid plans include point-in-time recovery
    diskSizeGB: 1 # staging holds almost nothing; storage can grow later but never shrink
    region: virginia # same region as the server, so they talk over Render's private network
    postgresMajorVersion: "17" # matches infra/docker-compose.yml and CI; cannot change later
    databaseName: fish
    user: fish
    ipAllowList: [] # no connections from outside Render at all

  - name: fish-production-db # the study's corpus; cannot be renamed later
    plan: 0.1c-256mb # as staging; point-in-time recovery for 3 days on Hobby (backups.md)
    diskSizeGB: 5 # about 0.6 MB a game, measured (pings dominate): 1,000 games need 0.6 GB
    region: virginia
    postgresMajorVersion: "17"
    databaseName: fish
    user: fish
    ipAllowList: []
