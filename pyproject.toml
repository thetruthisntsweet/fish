[project]
name = "fish-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fish-rules = { workspace = true }
fish-env = { workspace = true }
fish-agents = { workspace = true }
fish-server = { workspace = true }
fish-research = { workspace = true }

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
