[project]
name = "fish-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fish-rules = { workspace = true }
fish-env = { workspace = true }
fish-agents = { workspace = true }
fish-server = { workspace = true }
fish-research = { workspace = true }

[dependency-groups]
dev = ["pytest"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: style errors and warnings
    "F",        # pyflakes: unused imports, undefined names
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # modern syntax for the pinned Python
    "SIM",      # simplifications
    "C4",       # comprehensions
    "PT",       # pytest style
    "N",        # naming conventions
    "RUF",      # Ruff's own checks
]

[tool.ruff.lint.isort]
known-first-party = ["fish_rules", "fish_env", "fish_agents", "fish_server", "fish_research"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",   # a mistyped @pytest.mark name is an error, not silently ignored
    "--strict-config",    # a mistyped setting in this block is an error
    "-ra",                # summary of skipped/failed tests at the end
]
xfail_strict = true       # a test marked "expected to fail" that passes counts as a failure
filterwarnings = ["error"]  # any warning fails the test run

# ---------------------------------------------------------------- Pyright
[tool.pyright]
pythonVersion = "3.14"
include = ["packages"]
exclude = ["**/__pycache__", "**/.venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["packages/fish-rules"]

# ---------------------------------------------------------------- Coverage
[tool.coverage.run]
branch = true          # counts both sides of every if, not just lines
source_pkgs = ["fish_rules", "fish_env", "fish_agents", "fish_server", "fish_research"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85        # project-wide floor (§8)
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
