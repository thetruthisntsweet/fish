[project]
name = "fish-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fish-rules = { workspace = true }
fish-env = { workspace = true }
fish-agents = { workspace = true }
fish-server = { workspace = true }
fish-research = { workspace = true }

[dependency-groups]
dev = ["pytest"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: style errors and warnings
    "F",        # pyflakes: unused imports, undefined names
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # modern syntax for the pinned Python
    "SIM",      # simplifications
    "C4",       # comprehensions
    "PT",       # pytest style
    "N",        # naming conventions
    "RUF",      # Ruff's own checks
]

[tool.ruff.lint.isort]
known-first-party = ["fish_rules", "fish_env", "fish_agents", "fish_server", "fish_research"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
