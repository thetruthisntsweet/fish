[project]
name = "fish-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fish-rules = { workspace = true }
fish-env = { workspace = true }
fish-agents = { workspace = true }
fish-server = { workspace = true }
fish-research = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.169.0",
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: style errors and warnings
    "F",        # pyflakes: unused imports, undefined names
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # modern syntax for the pinned Python
    "SIM",      # simplifications
    "C4",       # comprehensions
    "PT",       # pytest style
    "N",        # naming conventions
    "RUF",      # Ruff's own checks
]

[tool.ruff.lint.isort]
known-first-party = ["fish_rules", "fish_env", "fish_agents", "fish_server", "fish_research"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",   # a mistyped @pytest.mark name is an error, not silently ignored
    "--strict-config",    # a mistyped setting in this block is an error
    "-ra",                # summary of skipped/failed tests at the end
]
xfail_strict = true       # a test marked "expected to fail" that passes counts as a failure
filterwarnings = ["error"]  # any warning fails the test run

# ---------------------------------------------------------------- Pyright
[tool.pyright]
pythonVersion = "3.14"
include = ["packages"]
exclude = ["**/__pycache__", "**/.venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["packages/fish-rules"]

# ---------------------------------------------------------------- Coverage
[tool.coverage.run]
branch = true          # counts both sides of every if, not just lines
source_pkgs = ["fish_rules", "fish_env", "fish_agents", "fish_server", "fish_research"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85        # project-wide floor (§8)
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ---------------------------------------------------------------- import-linter
# Package boundaries (Implementation Environment §5). Run: uv run lint-imports
[tool.importlinter]
root_packages = ["fish_rules", "fish_env", "fish_agents", "fish_server", "fish_research"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "fish-rules imports nothing from the project or outside the standard library"
type = "forbidden"
source_modules = ["fish_rules"]
forbidden_modules = [
    "fish_env", "fish_agents", "fish_server", "fish_research",
    "numpy", "pettingzoo", "gymnasium", "torch",
    "fastapi", "uvicorn", "sqlalchemy", "alembic", "psycopg", "pydantic",
]

[[tool.importlinter.contracts]]
name = "fish-env never imports the server or research packages"
type = "forbidden"
source_modules = ["fish_env"]
forbidden_modules = ["fish_server", "fish_research"]

[[tool.importlinter.contracts]]
name = "fish-agents never imports the server or research packages"
type = "forbidden"
source_modules = ["fish_agents"]
forbidden_modules = ["fish_server", "fish_research"]

[[tool.importlinter.contracts]]
name = "Only B3 may use PyTorch"
type = "forbidden"
source_modules = ["fish_agents.b0", "fish_agents.b1", "fish_agents.b2"]
forbidden_modules = ["torch"]

[[tool.importlinter.contracts]]
name = "fish-server never imports fish-env, fish-research or PyTorch, even indirectly"
type = "forbidden"
source_modules = ["fish_server"]
forbidden_modules = ["fish_env", "fish_research", "torch", "pettingzoo", "gymnasium"]
