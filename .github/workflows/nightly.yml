# Nightly deep checks (T2.1 §9). Runs at 07:17 UTC (early morning US Eastern), and on demand
# from the Actions tab. Failures show there and in GitHub's email notifications.
name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hypothesis:
    name: Hypothesis, nightly profile (50,000 examples), fish-rules
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # setup-uv publishes no short major tag (v10)
      - run: uv sync --locked --all-packages
      - run: uv run pytest packages/fish-rules
        env:
          HYPOTHESIS_PROFILE: nightly
  # A job of its own, so the environment and agents get the nightly profile too without
  # pushing the fish-rules job toward its time limit.
  hypothesis-env-agents:
    name: Hypothesis, nightly profile, fish-env and fish-agents
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # setup-uv publishes no short major tag (v10)
      - run: uv sync --locked --all-packages
      - run: uv run pytest packages/fish-env packages/fish-agents
        env:
          HYPOTHESIS_PROFILE: nightly
  # The website's games at the nightly profile (T3.5): 1,250 whole games each of the table
  # (every website rule) and of the game in progress (people leaving, B1 taking their seats,
  # its waits and presses), each checked and read back as a corpus record; and the wire leak
  # tests over 1,250 more (T3.7, docs/leaks.md). No database.
  hypothesis-server-games:
    name: Hypothesis, nightly profile, website games with handovers to B1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # setup-uv publishes no short major tag (v10)
      - run: uv sync --locked --all-packages
      - run: uv run pytest packages/fish-server/tests/test_table.py packages/fish-server/tests/test_game.py packages/fish-server/tests/test_wire_leaks.py
        env:
          HYPOTHESIS_PROFILE: nightly
  # 100,000 B0-vs-B0 games (T5.1), every R.9 invariant checked at every state of every game,
  # on as many processes as the runner has cores (about 17 games a second each). A failure
  # names the first failing seed; rerun it with --first-seed SEED --games 1.
  soak:
    name: Soak, 100,000 B0 games with every R.9 check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # setup-uv publishes no short major tag (v10)
      - run: uv sync --locked --all-packages
      - name: Play and check 100,000 B0 games
        shell: bash # with pipefail, so a failing check fails the step despite tee
        run: >-
          uv run python scripts/soak_b0.py --games 100000 --workers "$(nproc)" --json soak.json
          | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak
          path: soak.json

  # Layer 1 (T2.7) at every event of 3,000 B0 games, for every seat and the public view: the
  # truth is always named, and at one point in 20 a deal putting a card elsewhere is replayed
  # through the engine and must look the same to the observer. A failure names the first
  # failing seed; rerun it with --first-seed SEED --games 1.
  soak-deduce:
    name: Soak, Layer 1 on 3,000 B0 games
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # setup-uv publishes no short major tag (v10)
      - run: uv sync --locked --all-packages
      - name: Deduce and check at every event of 3,000 B0 games
        shell: bash # with pipefail, so a failing check fails the step despite tee
        run: >-
          uv run python scripts/soak_deduce.py --games 3000 --workers "$(nproc)" --json soak-deduce.json
          | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak-deduce
          path: soak-deduce.json

  # B1's evaluation (T5.2): at full, last-8, last-2 and no memory, 200 seeds against three B0s
  # and against three full-memory B1s (each seed with B1 as either team), and six B1s
  # together; every game gets the B0 soak's R.9 checks, and every call B1 proved must be
  # right. A failure names the first failing game; rerun it with --first-seed SEED --games 1.
  eval-b1:
    name: Evaluation and soak, B1 (200 seeds per matchup)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # setup-uv publishes no short major tag (v10)
      - run: uv sync --locked --all-packages
      - name: Play, check and score B1's games
        shell: bash # with pipefail, so a failing check fails the step despite tee
        run: >-
          uv run python scripts/eval_b1.py --games 200 --workers "$(nproc)" --json eval-b1.json
          | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-b1
          path: eval-b1.json
