# Release (T2.6). Pushing a tag vX.Y.Z publishes fish-rules, fish-env and fish-agents X.Y.Z to
# PyPI and makes a GitHub release with the same files. Run by hand (Actions > Release > Run
# workflow) it builds and checks everything but publishes nothing: a rehearsal.
# One-time setup and the steps of a release: docs/runbooks/release.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Two releases never run at once, and one in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# Actions are pinned to commits here, unlike ci.yml: this workflow holds the right to publish,
# so a moved tag must not change what runs. Update a pin to the commit of a newer release tag.
jobs:
  # ---------------------------------------------------------------- build and check
  # The files are built once, by the install check, and the files it checked are the ones
  # uploaded. No job here has a secret: PyPI trusts this workflow through OIDC.
  build:
    name: Build and check the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history of main, to check the tag is on it
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag, the packages, the changelog and the citation agree
        if: github.ref_type == 'tag'
        run: uv run --no-project --python 3.14 python scripts/check_release.py "$GITHUB_REF_NAME" --notes notes.md
      - name: Build, install from the built files, run the READMEs and examples
        run: uv run --no-project --python 3.14 python scripts/check_install.py --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.whl
            dist/*.tar.gz
            notes.md
          if-no-files-found: error

  # ---------------------------------------------------------------- PyPI
  # The "pypi" environment is the one PyPI's trusted publishers name; only tags may use it
  # (docs/runbooks/release.md). --check-url skips files already on PyPI, so a run that
  # failed halfway can be re-run.
  pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/fish-agents/
    permissions:
      id-token: write # the OIDC token PyPI exchanges for an upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  # ---------------------------------------------------------------- GitHub release
  # After PyPI, so a GitHub release always means the packages are installable.
  github:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
