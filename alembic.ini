# Alembic configuration (T2.1 subtask 9). Run from the repository root:
#   uv run --env-file .env alembic upgrade head
# The database URL is never written here: migrations/env.py reads FISH_DATABASE_URL.

[alembic]
script_location = %(here)s/packages/fish-server/migrations
prepend_sys_path = .
path_separator = os
# New migration files are named <revision>_<message>.py, e.g. 0002_create_events.py.
file_template = %%(rev)s_%%(slug)s

# Every new migration file is cleaned up by Ruff (unused imports removed, then formatted),
# so generated files pass scripts/check.sh without hand edits.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S